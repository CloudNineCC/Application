<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner - Cloud Computing Sprint 2</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Travel Planner</h1>
            <div id="auth-section" style="margin-top: 10px;">
                <div id="user-info" style="display: none; margin-bottom: 10px;"></div>
                <div id="google-signin-button"></div>
                <button id="logout-button" onclick="window.auth.logout()" style="display: none; margin-top: 10px; padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-button active" data-tab="destinations">Destinations</button>
            <button class="tab-button" data-tab="itineraries">My Itineraries</button>
            <button class="tab-button" data-tab="create">Create Itinerary</button>
        </div>

        <div id="destinations-tab" class="tab-content active">
            <h2>Available Destinations</h2>
            <div id="destinations-list" class="loading">Loading destinations...</div>
        </div>

        <div id="itineraries-tab" class="tab-content">
            <h2>All Itineraries</h2>
            <div id="itineraries-list" class="loading">Loading itineraries...</div>
        </div>

        <div id="create-tab" class="tab-content">
            <h2>Create New Itinerary</h2>
            <form id="create-itinerary-form" class="form">
                <div class="form-group">
                    <label for="itinerary-name">Itinerary Name:</label>
                    <input type="text" id="itinerary-name" required placeholder="e.g., Summer Europe Trip">
                </div>
                <div class="form-group">
                    <label for="owner-id">Owner User ID:</label>
                    <input type="text" id="owner-id" required placeholder="e.g., user123">
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" placeholder="Optional description"></textarea>
                </div>
                <div class="form-group">
                    <label for="start-date">Start Date:</label>
                    <input type="date" id="start-date">
                </div>
                <div class="form-group">
                    <label for="end-date">End Date:</label>
                    <input type="date" id="end-date">
                </div>
                <button type="submit" class="btn btn-primary">Create Itinerary</button>
            </form>
            <div id="create-result"></div>
        </div>

        <!-- Detailed Itinerary View (hidden by default) -->
        <div id="detail-view" class="detail-view" style="display: none;">
            <div class="detail-header">
                <button id="back-to-list" class="btn-back">← Back to Itineraries</button>
                <h2 id="detail-title"></h2>
                <div id="detail-meta" class="itinerary-meta"></div>
            </div>

            <div class="detail-tabs">
                <button class="detail-tab-btn active" data-detail-tab="overview">Overview</button>
                <button class="detail-tab-btn" data-detail-tab="segments">Segments</button>
                <button class="detail-tab-btn" data-detail-tab="comments">Comments</button>
                <button class="detail-tab-btn" data-detail-tab="activity">Activity</button>
                <button class="detail-tab-btn" data-detail-tab="pricing">Pricing</button>
            </div>

            <div id="overview-detail-tab" class="detail-tab-content active">
                <div id="overview-content"></div>
            </div>

            <div id="segments-detail-tab" class="detail-tab-content">
                <div class="section-header">
                    <h3>Trip Segments</h3>
                    <button id="add-segment-btn" class="btn btn-primary">+ Add Segment</button>
                </div>
                <div id="segments-list"></div>

                <!-- Add Segment Form (hidden by default) -->
                <div id="add-segment-form" class="form" style="display: none;">
                    <h4>Add New Segment</h4>
                    <div class="form-group">
                        <label>Destination City:</label>
                        <select id="new-segment-city" required>
                            <option value="">-- Select a city --</option>
                            <!-- Will be populated dynamically -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Start Date:</label>
                        <input type="date" id="new-segment-start" required>
                    </div>
                    <div class="form-group">
                        <label>End Date:</label>
                        <input type="date" id="new-segment-end" required>
                    </div>
                    <div class="form-group">
                        <label>Lodging Class:</label>
                        <select id="new-segment-lodging">
                            <option value="HOSTEL">Hostel</option>
                            <option value="STANDARD">Standard</option>
                            <option value="PREMIUM">Premium</option>
                        </select>
                    </div>
                    <button id="save-segment-btn" class="btn btn-primary">Save Segment</button>
                    <button id="cancel-segment-btn" class="btn">Cancel</button>
                </div>
            </div>

            <div id="comments-detail-tab" class="detail-tab-content">
                <div class="section-header">
                    <h3>Comments</h3>
                </div>
                <div id="comments-list"></div>

                <div class="add-comment-form">
                    <h4>Add Comment</h4>
                    <textarea id="new-comment-text" placeholder="Write a comment..." rows="4"></textarea>
                    <button id="add-comment-btn" class="btn btn-primary">Post Comment</button>
                </div>
            </div>

            <div id="activity-detail-tab" class="detail-tab-content">
                <h3>Activity Timeline</h3>
                <div id="activity-list"></div>
            </div>

            <div id="pricing-detail-tab" class="detail-tab-content">
                <h3>Pricing Quote</h3>
                <div id="pricing-content"></div>
            </div>
        </div>
    </div>

    <script src="auth.js?v=20251215-1"></script>
    <script src="app.js?v=20251215-1"></script>
</body>
</html>
